name: Test GTA6 Voice

on:
  push:
    branches: ["main"]
    paths:
      - "app.js"
      - "captionController.js"
      - "captionController.test.js"
      - "index.html"
      - "package.json"
      - "vite.config.js"
      - "styles.css"
      - ".github/workflows/test-v052.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run caption controller tests
        run: npm test
      - name: Build production site
        run: npm run build
